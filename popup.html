<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Utopia Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      /* Rich Modern Dark Palette */
      --bg-color: #0d0b11;
      --surface-color: rgba(26, 21, 35, 0.8);
      --surface-border: rgba(255, 255, 255, 0.08);
      --primary: #d0bcff;
      --on-primary: #381e72;
      --primary-glow: rgba(208, 188, 255, 0.15);
      --secondary: #ccc2dc;
      --on-secondary: #332d41;
      --accent: #a8e5a3;
      --on-accent: #0f3d12;
      --error: #f2b8b5;
      --on-error: #601410;
      --text-main: #f4effa;
      --text-sub: #b5aebf;
      --transition-speed: 0.2s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      background: linear-gradient(135deg, #0d0b11 0%, #1e152a 100%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      padding: 16px;
      line-height: 1.4;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #4f378b 0%, #381e72 100%);
      color: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(79, 55, 139, 0.3);
    }

    .logo-icon .material-symbols-rounded {
      font-size: 24px;
    }

    .logo-details {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2px;
      background: linear-gradient(to right, var(--text-main), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* Toggle Status Card */
    .toggle-card {
      background: var(--surface-color);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all var(--transition-speed);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .toggle-card:hover {
      border-color: rgba(208, 188, 255, 0.25);
      background: rgba(26, 21, 35, 0.95);
    }

    .toggle-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-status-icon {
      font-size: 28px;
      color: var(--text-sub);
      transition: color var(--transition-speed);
    }

    .toggle-details {
      display: flex;
      flex-direction: column;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .toggle-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Active state styling */
    .toggle-card.active {
      border-color: rgba(168, 229, 163, 0.3);
      background: rgba(15, 61, 18, 0.2);
    }

    .toggle-card.active .toggle-status-icon {
      color: var(--accent);
    }

    .toggle-card.active .toggle-value {
      color: var(--accent);
      text-shadow: 0 0 8px rgba(168, 229, 163, 0.3);
    }

    /* Switch toggle icon */
    .toggle-switch-icon {
      font-size: 36px;
      color: var(--text-sub);
      transition: color var(--transition-speed);
    }

    .toggle-card.active .toggle-switch-icon {
      color: var(--accent);
    }

    /* Sections */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      width: 100%;
    }

    .key-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      color: var(--text-main);
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      padding: 10px 42px 10px 12px;
      outline: none;
      transition: all var(--transition-speed);
    }

    .key-input:focus {
      border-color: var(--primary);
      background: rgba(208, 188, 255, 0.04);
    }

    select.key-input option, select.key-input optgroup {
      background-color: #1a1523;
      color: var(--text-main);
    }

    .visibility-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all var(--transition-speed);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
    }

    .btn-primary:hover {
      background: #eaddff;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Stored Keys List */
    .keys-list-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .keys-list-container::-webkit-scrollbar {
      width: 3px;
    }

    .keys-list-container::-webkit-scrollbar-thumb {
      background: var(--surface-border);
      border-radius: 2px;
    }

    .empty-keys {
      text-align: center;
      padding: 12px;
      font-size: 12px;
      color: var(--text-sub);
      border: 1px dashed var(--surface-border);
      border-radius: 10px;
    }

    .key-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .key-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-grow: 1;
    }

    .key-masked {
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .key-status {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-sub);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-sub);
    }

    .status-dot.active {
      background-color: var(--accent);
    }

    .status-dot.invalid {
      background-color: var(--error);
    }

    .key-actions {
      display: flex;
      gap: 2px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
    }

    .icon-btn-delete:hover {
      background: rgba(242, 184, 181, 0.12);
      color: var(--error);
    }

    .icon-btn .material-symbols-rounded {
      font-size: 16px;
    }

    /* Notification message */
    .status-msg {
      font-size: 11px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .status-msg.error {
      display: flex;
      background: rgba(140, 29, 24, 0.12);
      border: 1px solid rgba(242, 184, 181, 0.2);
      color: var(--error);
    }

    .status-msg.success {
      display: flex;
      background: rgba(15, 61, 18, 0.12);
      border: 1px solid rgba(168, 229, 163, 0.2);
      color: var(--accent);
    }

    .status-msg.info {
      display: flex;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--surface-border);
      color: var(--primary);
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo-icon">
      <span class="material-symbols-rounded">smart_toy</span>
    </div>
    <div class="logo-details">
      <div class="logo-title">Utopia Agent</div>
      <div class="logo-sub">Trigger with Ctrl + Shift + S</div>
    </div>
  </div>

  <!-- Toggle Card (Activate / Deactivate) -->
  <div class="toggle-card" id="toggleCard">
    <div class="toggle-info">
      <span class="material-symbols-rounded toggle-status-icon" id="toggleStatusIcon">power_settings_new</span>
      <div class="toggle-details">
        <span class="toggle-label">Agent State</span>
        <span class="toggle-value" id="toggleValue">Inactive</span>
      </div>
    </div>
    <span class="material-symbols-rounded toggle-switch-icon" id="toggleSwitchIcon">toggle_off</span>
  </div>

  <!-- Model Selection -->
  <div class="input-group">
    <div class="section-title">AI Model Settings</div>
    <select id="modelSelect" class="key-input" style="font-family: inherit; font-size: 13px; cursor: pointer;">
      <optgroup label="Groq Models">
        <option value="groq/llama-3.3-70b-versatile" selected>Llama 3.3 70B Versatile (Groq)</option>
        <option value="groq/llama-3.1-8b-instant">Llama 3.1 8B Instant (Groq)</option>
        <option value="groq/mixtral-8x7b-32768">Mixtral 8x7B (Groq)</option>
        <option value="groq/gemma2-9b-it">Gemma 2 9B (Groq)</option>
      </optgroup>
      <optgroup label="OpenRouter Models">
        <option value="openrouter/meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B (OpenRouter)</option>
        <option value="openrouter/meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B Free (OpenRouter)</option>
        <option value="openrouter/google/gemini-2.5-flash">Gemini 2.5 Flash (OpenRouter)</option>
        <option value="openrouter/google/gemini-2.5-pro">Gemini 2.5 Pro (OpenRouter)</option>
        <option value="openrouter/meta-llama/llama-3.1-8b-instruct">Llama 3.1 8B (OpenRouter)</option>
      </optgroup>
    </select>
  </div>

  <!-- Key Provider Selection -->
  <div class="input-group">
    <div class="section-title">API Key Provider</div>
    <select id="keyProviderSelect" class="key-input" style="font-family: inherit; font-size: 13px; cursor: pointer;">
      <option value="groq" selected>Groq</option>
      <option value="openrouter">OpenRouter</option>
    </select>
  </div>

  <!-- Add Key Section -->
  <div class="input-group">
    <div class="section-title">Add API Key</div>
    <div class="input-wrapper">
      <input type="password" id="apiKeyInput" class="key-input" placeholder="gsk_... or sk-or-..." />
      <button class="visibility-toggle" id="toggleVisibility" title="Toggle visibility">
        <span class="material-symbols-rounded" style="font-size: 18px;" id="visibilityIcon">visibility_off</span>
      </button>
    </div>
    <button class="btn btn-primary" id="saveKeyBtn">
      <span class="material-symbols-rounded" style="font-size: 16px;">add_circle</span> Add Key
    </button>
  </div>

  <!-- Status notifications inside popup -->
  <div class="status-msg" id="statusMessage">
    <span class="material-symbols-rounded" style="font-size: 14px;" id="statusIcon">info</span>
    <span id="statusText"></span>
  </div>

  <!-- Keys List -->
  <div class="input-group">
    <div class="section-title">Your Stored API Keys</div>
    <div class="keys-list-container" id="keysList">
      <!-- Dynamically filled -->
      <div class="empty-keys">No API keys saved. Add one above!</div>
    </div>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
